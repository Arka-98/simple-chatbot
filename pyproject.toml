[project]
name = "simple-chatbot-01"
version = "0.1.0"
description = "A beginner-friendly LangGraph chatbot with SQLite persistence and a Streamlit UI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "chatbot"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
